[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "php-fpm -D && nginx -g 'daemon off;'"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
preDeployCommand = "php artisan migrate --force && php artisan db:seed --force"

[variables]
APP_ENV = "production"
APP_DEBUG = "false"
LOG_LEVEL = "error"