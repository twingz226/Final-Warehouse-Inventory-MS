version: '3.8'

services:
  # 1. PHP Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deka_sales_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - deka_network
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=deka_sales
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      - db

  # 2. MySQL Database Service
  db:
    image: mysql:8.0
    container_name: deka_sales_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: deka_sales
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - deka_network

  # 3. Nginx Web Server Service
  nginx:
    image: nginx:alpine
    container_name: deka_sales_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - deka_network

networks:
  deka_network:
    driver: bridge

volumes:
  db_data:
    driver: local